services:
  bot:
    build: .
    container_name: translation-bot
    restart: unless-stopped

    # Pulls TOKEN, DATABASE, MONGO_URI, MEGA, etc. from ./.env at start.
    # Copy .env.example to .env and fill in real values first.
    env_file:
      - .env

    volumes:
      # Persist logs + the healthcheck.json heartbeat file across restarts.
      - ./logs:/app/logs

      # Only needed if you use Mega for backups. Uncomment once you've set
      # MEGA / MEGA_HOST_PATH in .env and have a real pickle file at that
      # host path -- leaving this uncommented with no such file will make
      # Docker create an empty directory there instead, which breaks it.
      # - ${MEGA_HOST_PATH}:/app/secrets/mega.pkl:ro

    # Headless Chrome (used by cogs/crawler.py's Selenium scraping) can
    # crash under load with Docker's default 64MB /dev/shm. The bot already
    # passes --disable-dev-shm-usage, but a larger shm is safer if you're
    # running multiple scrapes concurrently.
    shm_size: "1gb"
